# On each new commit to master, create/update a PR with release
# automatically bumps version and creates changelog as per conventional commits
name: Release Github

on:
  push:
    branches:
      - master

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BEE_RUNNER_APP_ID }}
          private-key: ${{ secrets.BEE_RUNNER_KEY }}
      - uses: GoogleCloudPlatform/release-please-action@v2
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-type: node
          package-name: swarm-cli
